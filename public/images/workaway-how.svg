<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 430" role="img" aria-label="ワークアウェイの仕組み。旅人は1日数時間の手伝いをし、ホストは宿と食事を用意する。旅人は年会費を払って登録し、ホストに直接メッセージを送って、日程と仕事の内容を決める">
<style>text{font-family:"Hiragino Sans","Noto Sans JP","Noto Sans CJK JP","Yu Gothic","Meiryo",sans-serif;fill:#2b2b2b}.sub{fill:#5f5f5f}.w{fill:#ffffff}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2e6f6a"/></marker></defs>
<rect width="340" height="430" fill="#ffffff"/>
<text x="12" y="26" font-size="16" font-weight="700">ワークアウェイの仕組み</text>
<text x="12" y="47" font-size="13" class="sub">お金ではなく、手伝いと宿・食事を交換する</text>
<rect x="12" y="66" width="130" height="78" rx="12" fill="#e5f0ed" stroke="#2e6f6a"/>
<text x="77" y="98" font-size="15" font-weight="700" text-anchor="middle">旅人</text>
<text x="77" y="122" font-size="12" text-anchor="middle" class="sub">（ワークアウェイヤー）</text>
<rect x="198" y="66" width="130" height="78" rx="12" fill="#e5f0ed" stroke="#2e6f6a"/>
<text x="263" y="98" font-size="15" font-weight="700" text-anchor="middle">ホスト</text>
<text x="263" y="122" font-size="12" text-anchor="middle" class="sub">家庭・農園・宿など</text>
<line x1="146" y1="88" x2="192" y2="88" stroke="#2e6f6a" stroke-width="2" marker-end="url(#a)"/>
<line x1="194" y1="124" x2="148" y2="124" stroke="#2e6f6a" stroke-width="2" marker-end="url(#a)"/>
<text x="170" y="162" font-size="12.5" text-anchor="middle">→ 1日数時間の手伝い</text>
<text x="170" y="182" font-size="12.5" text-anchor="middle">← 宿と食事</text>
<line x1="12" y1="202" x2="328" y2="202" stroke="#e7e0d4"/>
<text x="12" y="228" font-size="14" font-weight="700">始めるまでの流れ</text>
<g font-size="13">
<circle cx="26" cy="256" r="12" fill="#2e6f6a"/><text x="26" y="261" text-anchor="middle" font-weight="700" class="w">1</text>
<text x="46" y="261">年会費を払って、プロフィールを作る</text>
<circle cx="26" cy="292" r="12" fill="#2e6f6a"/><text x="26" y="297" text-anchor="middle" font-weight="700" class="w">2</text>
<text x="46" y="297">国や仕事の種類で、ホストを探す</text>
<circle cx="26" cy="328" r="12" fill="#2e6f6a"/><text x="26" y="333" text-anchor="middle" font-weight="700" class="w">3</text>
<text x="46" y="333">ホストにメッセージを送る</text>
<circle cx="26" cy="364" r="12" fill="#2e6f6a"/><text x="26" y="369" text-anchor="middle" font-weight="700" class="w">4</text>
<text x="46" y="369">日程・時間・食事の条件を決めて、出発</text>
</g>
<text x="12" y="410" font-size="11.5" class="sub">公式の目安は、1日4〜5時間・週5日の手伝い</text>
</svg>
