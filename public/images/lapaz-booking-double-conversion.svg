<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 520" role="img" aria-label="Booking.comの表示より高く請求された流れ。ボリビアーノの表示を、宿で銀行のドルのレートでドルに直し、ドルで払えないため、もう一度ボリビアーノに直して請求された">
<style>text{font-family:"Hiragino Sans","Noto Sans JP","Noto Sans CJK JP","Yu Gothic","Meiryo",sans-serif;fill:#2b2b2b}.sub{fill:#5f5f5f}.w{fill:#ffffff}</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2e6f6a"/></marker><marker id="ar2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c8553d"/></marker></defs>
<rect width="340" height="520" fill="#ffffff"/>
<text x="12" y="26" font-size="16" font-weight="700">表示より高く請求された流れ</text>
<text x="12" y="47" font-size="13" class="sub">ラパスのホテル（Booking.com）・私の場合</text>

<rect x="12" y="62" width="316" height="72" rx="12" fill="#e5f0ed" stroke="#2e6f6a"/>
<circle cx="38" cy="98" r="14" fill="#2e6f6a"/><text x="38" y="103" font-size="14" font-weight="700" text-anchor="middle" class="w">1</text>
<text x="62" y="92" font-size="15" font-weight="700">Booking.comの表示</text>
<text x="62" y="116" font-size="13" class="sub">ボリビアーノ（Bs）で表示されていた</text>

<line x1="170" y1="136" x2="170" y2="160" stroke="#2e6f6a" stroke-width="2" marker-end="url(#ar)"/>
<text x="182" y="153" font-size="12" class="sub">宿で支払うとき</text>

<rect x="12" y="166" width="316" height="72" rx="12" fill="#e5f0ed" stroke="#2e6f6a"/>
<circle cx="38" cy="202" r="14" fill="#2e6f6a"/><text x="38" y="207" font-size="14" font-weight="700" text-anchor="middle" class="w">2</text>
<text x="62" y="196" font-size="15" font-weight="700">ドルに直された</text>
<text x="62" y="220" font-size="13" class="sub">銀行のドルのレートで　Bs → US$</text>

<line x1="170" y1="240" x2="170" y2="264" stroke="#2e6f6a" stroke-width="2" marker-end="url(#ar)"/>
<text x="182" y="257" font-size="12" class="sub">ドルで払えなかった</text>

<rect x="12" y="270" width="316" height="72" rx="12" fill="#e5f0ed" stroke="#2e6f6a"/>
<circle cx="38" cy="306" r="14" fill="#2e6f6a"/><text x="38" y="311" font-size="14" font-weight="700" text-anchor="middle" class="w">3</text>
<text x="62" y="300" font-size="15" font-weight="700">もう一度ボリビアーノに</text>
<text x="62" y="324" font-size="13" class="sub">US$ → Bs（換算が2回入った）</text>

<line x1="170" y1="344" x2="170" y2="368" stroke="#c8553d" stroke-width="2" marker-end="url(#ar2)"/>

<rect x="12" y="374" width="316" height="64" rx="12" fill="#fbece8" stroke="#c8553d" stroke-width="2"/>
<text x="170" y="403" font-size="16" font-weight="700" text-anchor="middle" style="fill:#c8553d">表示より高い請求に</text>
<text x="170" y="426" font-size="13" text-anchor="middle" class="sub">予約画面の金額では、泊まれなかった</text>

<rect x="12" y="452" width="316" height="56" rx="10" fill="#faf7f2" stroke="#e7e0d4"/>
<text x="26" y="476" font-size="13" font-weight="700">今の私なら</text>
<text x="26" y="496" font-size="13">先に「何の通貨で請求されるか」を宿に聞きます</text>
</svg>
