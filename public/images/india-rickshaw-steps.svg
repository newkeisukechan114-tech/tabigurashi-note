<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 470" role="img" aria-label="オートリキシャの値段交渉の手順。1.Uberで同じ区間の相場を見る、2.その金額を上限に決める、3.行き先と片道だけと金額を先に伝える、4.ツアーや追加の話は断る、5.合わなければ降りて別のリキシャを探す">
<style>text{font-family:"Hiragino Sans","Noto Sans JP","Noto Sans CJK JP","Yu Gothic","Meiryo",sans-serif;fill:#2b2b2b}.sub{fill:#5f5f5f}.w{fill:#ffffff}</style>
<rect width="340" height="470" fill="#ffffff"/>
<text x="12" y="26" font-size="16" font-weight="700">オートリキシャの値段交渉</text>
<text x="12" y="47" font-size="13" class="sub">私がインドでやった手順</text>
<line x1="38" y1="88" x2="38" y2="372" stroke="#a9cfcb" stroke-width="3"/>
<g>
<circle cx="38" cy="88" r="16" fill="#2e6f6a"/><text x="38" y="94" font-size="15" font-weight="700" text-anchor="middle" class="w">1</text>
<text x="66" y="84" font-size="15" font-weight="700">Uberで相場を見る</text>
<text x="66" y="105" font-size="12.5" class="sub">行き先を入れると、目安の金額が出る</text>
</g>
<g>
<circle cx="38" cy="159" r="16" fill="#2e6f6a"/><text x="38" y="165" font-size="15" font-weight="700" text-anchor="middle" class="w">2</text>
<text x="66" y="155" font-size="15" font-weight="700">その金額を「上限」にする</text>
<text x="66" y="176" font-size="12.5" class="sub">これより高ければ、乗らない</text>
</g>
<g>
<circle cx="38" cy="230" r="16" fill="#2e6f6a"/><text x="38" y="236" font-size="15" font-weight="700" text-anchor="middle" class="w">3</text>
<text x="66" y="226" font-size="15" font-weight="700">乗る前に、3つを伝える</text>
<text x="66" y="247" font-size="12.5" class="sub">行き先・「片道だけ」・金額</text>
</g>
<g>
<circle cx="38" cy="301" r="16" fill="#2e6f6a"/><text x="38" y="307" font-size="15" font-weight="700" text-anchor="middle" class="w">4</text>
<text x="66" y="297" font-size="15" font-weight="700">ツアーや寄り道は断る</text>
<text x="66" y="318" font-size="12.5" class="sub">「100ルピーで、片道だけ」とくり返した</text>
</g>
<g>
<circle cx="38" cy="372" r="16" fill="#c8553d"/><text x="38" y="378" font-size="15" font-weight="700" text-anchor="middle" class="w">5</text>
<text x="66" y="368" font-size="15" font-weight="700" style="fill:#c8553d">違ったら、降りて別のリキシャへ</text>
<text x="66" y="389" font-size="12.5" class="sub">アグラでは、別の1台に100ルピーで乗れた</text>
</g>
<rect x="12" y="414" width="316" height="44" rx="10" fill="#fbece8" stroke="#e7c3b9"/>
<text x="170" y="441" font-size="13" text-anchor="middle">駅で声をかけてくる人には、ついていかない</text>
</svg>
