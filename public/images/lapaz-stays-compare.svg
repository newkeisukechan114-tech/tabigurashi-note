<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 470" role="img" aria-label="ラパスで泊まった3つの宿の1泊あたりの料金。ホテル約2,400円（8泊）、Airbnbの部屋まるごと約3,000円（3泊）、Airbnbの個室約2,200円（3泊）">
<style>text{font-family:"Hiragino Sans","Noto Sans JP","Noto Sans CJK JP","Yu Gothic","Meiryo",sans-serif;fill:#2b2b2b}.sub{fill:#5f5f5f}.w{fill:#ffffff}</style>
<rect width="340" height="470" fill="#ffffff"/>
<text x="12" y="26" font-size="16" font-weight="700">ラパスで泊まった3つの宿</text>
<text x="12" y="47" font-size="13" class="sub">1泊あたりの料金（泊まった順・2026年5〜6月）</text>

<!-- 1 hotel -->
<circle cx="24" cy="80" r="11" fill="#2e6f6a"/><text x="24" y="85" font-size="13" font-weight="700" text-anchor="middle" class="w">1</text>
<text x="42" y="85" font-size="15" font-weight="700">ホテル</text>
<text x="328" y="85" font-size="13" text-anchor="end" class="sub">Booking.com・8泊</text>
<rect x="12" y="96" width="182" height="26" rx="5" fill="#2e6f6a"/>
<text x="202" y="115" font-size="16" font-weight="700">約2,400円</text>
<text x="12" y="144" font-size="12.5" style="fill:#c8553d">宿で払うときに、表示より高く請求された</text>

<!-- 2 whole -->
<circle cx="24" cy="180" r="11" fill="#2e6f6a"/><text x="24" y="185" font-size="13" font-weight="700" text-anchor="middle" class="w">2</text>
<text x="42" y="185" font-size="15" font-weight="700">Airbnbの部屋まるごと</text>
<text x="328" y="185" font-size="13" text-anchor="end" class="sub">3泊</text>
<rect x="12" y="196" width="228" height="26" rx="5" fill="#2e6f6a"/>
<text x="248" y="215" font-size="16" font-weight="700">約3,000円</text>
<text x="12" y="244" font-size="12.5" class="sub">リビング・キッチン・バスルーム・洗濯機</text>

<!-- 3 private -->
<circle cx="24" cy="280" r="11" fill="#2e6f6a"/><text x="24" y="285" font-size="13" font-weight="700" text-anchor="middle" class="w">3</text>
<text x="42" y="285" font-size="15" font-weight="700">Airbnbの個室</text>
<text x="328" y="285" font-size="13" text-anchor="end" class="sub">3泊</text>
<rect x="12" y="296" width="167" height="26" rx="5" fill="#2e6f6a"/>
<text x="187" y="315" font-size="16" font-weight="700">約2,200円</text>
<text x="12" y="344" font-size="12.5" class="sub">共有のリビング・キッチン・洗濯機</text>

<line x1="12" y1="366" x2="328" y2="366" stroke="#e7e0d4"/>
<text x="12" y="390" font-size="13" font-weight="700">気づいたこと</text>
<text x="12" y="412" font-size="13">・現金で払うと、カードの手数料の分だけ安かった</text>
<text x="12" y="434" font-size="13">・延泊すると、料金が高くなった</text>
<text x="12" y="458" font-size="11.5" class="sub">円は当時の目安です。割引のあとの料金を含みます。</text>
</svg>
